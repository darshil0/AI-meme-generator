<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AI Meme Generator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <!-- Fonts (kept here instead of @import in CSS for better performance) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Global styles built by Angular (includes Tailwind from styles.scss) -->
    <link rel="stylesheet" href="styles.css" />

    <style>
      body {
        font-family: 'Inter', sans-serif;
      }

      .meme-font {
        font-family: 'Impact', sans-serif;
        text-transform: uppercase;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border-width: 0;
      }
    </style>

    <script type="importmap">
      {
        "imports": {
          "rxjs": "https://esm.sh/rxjs@^7.8.2?conditions=es2015",
          "rxjs/operators": "https://esm.sh/rxjs@^7.8.2/operators?conditions=es2015",
          "rxjs/ajax": "https://esm.sh/rxjs@^7.8.2/ajax?conditions=es2015",
          "rxjs/webSocket": "https://esm.sh/rxjs@^7.8.2/webSocket?conditions=es2015",
          "rxjs/testing": "https://esm.sh/rxjs@^7.8.2/testing?conditions=es2015",
          "rxjs/fetch": "https://esm.sh/rxjs@^7.8.2/fetch?conditions=es2015",
          "@google/genai": "https://esm.sh/@google/genai@^1.35.0?external=rxjs",
          "@angular/core": "https://esm.sh/@angular/core@^21.0.8?external=rxjs",
          "@angular/compiler": "https://esm.sh/@angular/compiler@^21.0.8?external=rxjs",
          "@angular/platform-browser": "https://esm.sh/@angular/platform-browser@^21.0.8?external=rxjs",
          "@angular/common": "https://esm.sh/@angular/common@^21.0.8?external=rxjs",
          "@angular/common/http": "https://esm.sh/@angular/common@^21.0.8/http?external=rxjs"
        }
      }
    </script>
  </head>

  <body class="bg-gray-900">
    <app-root></app-root>
  </body>
</html>
